server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite puts a content hash in asset names, so they never change once built
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    # BrowserRouter: send unknown paths to index.html
    try_files $uri /index.html;
  }
}
